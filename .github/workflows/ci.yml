name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 proves the platform still runs with Moss absent (the regex-only
        # degradation path); 3.11 runs the full semantic suite.
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        working-directory: platform
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Moss availability
        working-directory: platform
        run: |
          python - <<'PY'
          try:
              import moss
              print(f"moss {moss.__name__} available")
          except ImportError as exc:
              print(f"moss absent ({exc}) — regex-only path under test")
          PY

      - name: App imports
        working-directory: platform
        run: python -c "import main; print('ok')"

      - name: Dataset integrity (eval set held out from indexed corpus)
        working-directory: platform
        run: python -c "import eval_data; eval_data.assert_disjoint_from_corpus(); print('disjoint ok')"

      - name: Unit + integration tests
        working-directory: platform
        run: python -m pytest tests/ -v

      - name: Evaluation harness executes
        working-directory: platform
        run: python eval_semantic.py --no-concurrency

      - name: Evaluation harness end-to-end (stub transport)
        if: matrix.python-version == '3.11'
        working-directory: platform
        run: python eval_semantic.py --stub --json /tmp/eval.json

      - name: Upload eval results
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: /tmp/eval.json
